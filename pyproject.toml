[project]
name = "jeevanroute"
version = "0.1.0"
description = "JeevanRoute — AI Emergency Commander (triage + routing) for Nepal"
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "openai>=1.40.0",
    "agno>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "watchfiles>=0.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
